services:
  wordfeud-gallery:
    build: .
    image: wordfeud-gallery:selfhost
    restart: unless-stopped
    ports:
      # Stable LAN address (replaces the old random OpenHands port).
      - "0.0.0.0:43895:8011"
      # Loopback so the host Caddy route can reach it.
      - "127.0.0.1:8011:8011"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8011/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
